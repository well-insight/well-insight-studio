        // ================================================================
        //  8. 右侧 Tab 切换
        // ================================================================
        function switchRightTab(tab) {
            document.querySelectorAll('.right-panel .tabs .tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.right-panel .tabs .tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById('propsPanel').style.display = tab === 'props' ? 'block' : 'none';
            document.getElementById('layersPanel').style.display = tab === 'layers' ? 'block' : 'none';
            if (tab === 'layers') renderLayersPanel();
            else renderPropsPanel();
        }

        // ================================================================
        //  9. 拖拽交互
        // ================================================================
        const GRID_SIZE = 8;
        const snap = (v) => Math.round(v / GRID_SIZE) * GRID_SIZE;

        function startDrag(e, id) {
            const el = e.currentTarget;
            const rect = el.getBoundingClientRect();
            pushHistory();
            dragState = {
                widgetId: id,
                moved: false,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
            };
            document.addEventListener('mousemove', onDragMove);
            document.addEventListener('mouseup', onDragEnd);
            e.preventDefault();
        }

        function onDragMove(e) {
            if (!dragState) return;
            const containerRect = document.getElementById('canvasContainer').getBoundingClientRect();
            const w = widgets.find(w => w.id === dragState.widgetId);
            if (!w || w.locked) return;
            let x = e.clientX - containerRect.left - dragState.offsetX;
            let y = e.clientY - containerRect.top - dragState.offsetY;
            x = Math.max(0, snap(x));
            y = Math.max(0, snap(y));
            if (x !== w.x || y !== w.y) dragState.moved = true;
            w.x = x;
            w.y = y;
            renderWidgets();
            renderPropsPanel();
        }

        function onDragEnd(e) {
            // 未发生位移时撤销刚才压入的快照，避免空操作污染历史栈
            if (dragState && !dragState.moved) {
                undoStack.pop();
                updateHistoryButtons();
            } else {
                scheduleSave();
            }
            dragState = null;
            document.removeEventListener('mousemove', onDragMove);
            document.removeEventListener('mouseup', onDragEnd);
        }

        function startResize(e, id) {
            const w = widgets.find(w => w.id === id);
            if (!w || w.locked) return;
            pushHistory();
            resizeState = {
                widgetId: id,
                moved: false,
                startX: e.clientX,
                startY: e.clientY,
                startWidth: w.width,
                startHeight: w.height
            };
            document.addEventListener('mousemove', onResizeMove);
            document.addEventListener('mouseup', onResizeEnd);
            e.preventDefault();
        }

        function onResizeMove(e) {
            if (!resizeState) return;
            const w = widgets.find(w => w.id === resizeState.widgetId);
            if (!w) return;
            const dx = e.clientX - resizeState.startX;
            const dy = e.clientY - resizeState.startY;
            const newWidth = Math.max(110, snap(resizeState.startWidth + dx));
            const newHeight = Math.max(70, snap(resizeState.startHeight + dy));
            if (newWidth !== w.width || newHeight !== w.height) resizeState.moved = true;
            w.width = newWidth;
            w.height = newHeight;
            renderWidgets();
            renderPropsPanel();
        }

        function onResizeEnd(e) {
            if (resizeState && !resizeState.moved) {
                undoStack.pop();
                updateHistoryButtons();
            } else {
                scheduleSave();
            }
            resizeState = null;
            document.removeEventListener('mousemove', onResizeMove);
            document.removeEventListener('mouseup', onResizeEnd);
        }

        // ================================================================
        //  10. 从左侧拖拽到画布
        // ================================================================
        const canvasContainer = document.getElementById('canvasContainer');
        canvasContainer.addEventListener('dragover', function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
            this.classList.add('drag-over');
        });
        canvasContainer.addEventListener('dragleave', function(e) {
            this.classList.remove('drag-over');
        });
        canvasContainer.addEventListener('drop', function(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const raw = e.dataTransfer.getData('text/plain');
            if (!raw) return;
            try {
                const { table, field } = JSON.parse(raw);
                const data = getTableData(table);
                const idx = data.fields.indexOf(field);
                const isNum = idx >= 0 && data.rows.length > 0 && typeof data.rows[0]?.[idx] === 'number';
                const type = isNum ? 'bar' : 'table';
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left - 110;
                const y = e.clientY - rect.top - 50;
                const title = `${field} 分析`;
                addWidget(type, {
                    title: title,
                    dataSource: table,
                    field: field,
                    x: Math.max(8, x),
                    y: Math.max(8, y)
                });
                showToast(`✨ 从「${table}.${field}」生成 ${WIDGET_TYPES[type].label}`);
            } catch (err) {
                showToast('⚠️ 拖拽解析失败');
            }
        });

        // ================================================================
        //  11. 缩放画布
        // ================================================================
        function zoomCanvas(delta) {
            canvasZoom = Math.max(0.4, Math.min(1.6, canvasZoom + delta));
            document.getElementById('zoomLevel').textContent = Math.round(canvasZoom * 100) + '%';
            const container = document.getElementById('canvasContainer');
            container.style.transform = `scale(${canvasZoom})`;
            container.style.transformOrigin = 'top left';
        }

        // ================================================================
        //  12. 清空画布
        // ================================================================
        document.getElementById('resetCanvasBtn').addEventListener('click', function() {
            if (widgets.length === 0) return;
            if (confirm('确定清空画布所有组件？（可撤销）')) {
                pushHistory();
                widgets = [];
                selectedWidgetId = null;
                renderAll();
                updateCount();
                scheduleSave();
                showToast('🗑️ 画布已清空，Ctrl+Z 可撤销');
            }
        });

        // ================================================================
        //  13. 计数更新
        // ================================================================
        function updateCount() {
            document.getElementById('widgetCount').textContent = widgets.length;
            document.getElementById('layerBadge').textContent = widgets.length;
        }

        // ================================================================
        //  14. Toast
        // ================================================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        // ================================================================
        //  15. 快捷键
        // ================================================================
        document.addEventListener('keydown', (e) => {
            const inInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);

            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
                if (inInput) return;
                e.preventDefault();
                undo();
                return;
            }
            if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' ||
                    (e.key.toLowerCase() === 'z' && e.shiftKey))) {
                if (inInput) return;
                e.preventDefault();
                redo();
                return;
            }
            if (e.key === 'Delete' && selectedWidgetId !== null && !inInput) {
                if (confirm('删除选中的组件？')) deleteWidget(selectedWidgetId);
            }
            if (e.key === 'Escape') {
                if (document.getElementById('configOverlay').classList.contains('active')) {
                    closeConfig();
                } else {
                    selectedWidgetId = null;
                    renderAll();
                }
            }
        });

        // ================================================================
        //  16. 配置弹窗 (支持多字段)
        // ================================================================
        function openConfig(id) {
            const w = widgets.find(w => w.id === id);
            if (!w) return;
            configTargetId = id;
            configSelectedFields = [];
            // 初始化字段操作配置
            configFieldOps = {};
            const data = getTableData(w.dataSource);
            data.fields.forEach(f => {
                const isNum = data.rows.length > 0 && typeof data.rows[0]?.[data.fields.indexOf(f)] === 'number';
                configFieldOps[f] = {
                    agg: isNum ? 'sum' : 'none',
                    sort: 'none',
                    filter: '',
                    hidden: false,
                    alias: f
                };
            });

            document.getElementById('configTitle').textContent = `配置: ${w.title}`;
            document.getElementById('configOverlay').classList.add('active');

            // 填充数据源下拉
            const dsSelect = document.getElementById('configDataSource');
            dsSelect.innerHTML = '';
            Object.keys(currentData).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                if (name === w.dataSource) opt.selected = true;
                dsSelect.appendChild(opt);
            });

            renderConfigFieldList();
            renderConfigOpPanel();
            renderConfigPreview();
            updateConfigFieldCount();
        }

        function closeConfig() {
            document.getElementById('configOverlay').classList.remove('active');
            configTargetId = null;
            configSelectedFields = [];
        }

        function onConfigDataSourceChange() {
            // 重置字段操作
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);
            configFieldOps = {};
            data.fields.forEach(f => {
                const isNum = data.rows.length > 0 && typeof data.rows[0]?.[data.fields.indexOf(f)] === 'number';
                configFieldOps[f] = {
                    agg: isNum ? 'sum' : 'none',
                    sort: 'none',
                    filter: '',
                    hidden: false,
                    alias: f
                };
            });
            configSelectedFields = [];
            renderConfigFieldList();
            renderConfigOpPanel();
            renderConfigPreview();
            updateConfigFieldCount();
        }

        // ---- 字段列表渲染（含复选框） ----
        function renderConfigFieldList() {
            const container = document.getElementById('configFieldList');
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);
            container.innerHTML = '';
            data.fields.forEach(f => {
                const isNum = data.rows.length > 0 && typeof data.rows[0]?.[data.fields.indexOf(f)] === 'number';
                const checked = configSelectedFields.includes(f);
                const ops = configFieldOps[f] || { agg: 'none', sort: 'none', filter: '', hidden: false, alias: f };
                const div = document.createElement('div');
                div.className = `field-item-config ${checked ? 'selected' : ''}`;
                div.dataset.field = f;
                div.innerHTML = `
                    <input type="checkbox" class="f-checkbox" ${checked ? 'checked' : ''} />
                    <span class="f-icon"><i class="fas ${isNum ? 'fa-hashtag' : 'fa-font'}"></i></span>
                    <span class="f-name">${ops.alias || f}</span>
                    <span class="f-type">${isNum ? 'num' : 'str'}</span>
                    <span class="f-check ${!ops.hidden ? 'checked' : ''}"><i class="fas fa-${ops.hidden ? 'eye-slash' : 'eye'}"></i></span>
                `;
                // 点击行或复选框切换选中
                div.addEventListener('click', function(e) {
                    if (e.target.type === 'checkbox') {
                        // 由change事件处理
                        return;
                    }
                    const cb = this.querySelector('.f-checkbox');
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change'));
                });
                const cb = div.querySelector('.f-checkbox');
                cb.addEventListener('change', function(e) {
                    e.stopPropagation();
                    const field = this.closest('.field-item-config').dataset.field;
                    if (this.checked) {
                        if (!configSelectedFields.includes(field)) {
                            configSelectedFields.push(field);
                        }
                    } else {
                        const idx = configSelectedFields.indexOf(field);
                        if (idx > -1) configSelectedFields.splice(idx, 1);
                    }
                    renderConfigFieldList();
                    renderConfigOpPanel();
                    renderConfigPreview();
                });
                container.appendChild(div);
            });
            document.getElementById('leftFieldCount').textContent = configSelectedFields.length;
        }

        function selectAllFields() {
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);
            configSelectedFields = data.fields.slice();
            renderConfigFieldList();
            renderConfigOpPanel();
            renderConfigPreview();
        }

        function deselectAllFields() {
            configSelectedFields = [];
            renderConfigFieldList();
            renderConfigOpPanel();
            renderConfigPreview();
        }

        // ---- 操作面板（批量或单个） ----
        function renderConfigOpPanel() {
            const container = document.getElementById('configOpPanel');
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);

            if (configSelectedFields.length === 0) {
                container.innerHTML = `
                    <div class="no-selection">
                        <i class="fas fa-arrow-pointer"></i>
                        请勾选左侧字段进行配置
                    </div>
                `;
                document.getElementById('selectedFieldName').textContent = '未选择';
                return;
            }

            const isMulti = configSelectedFields.length > 1;
            document.getElementById('selectedFieldName').textContent =
                `${configSelectedFields.length} 个字段${isMulti ? ' (批量)' : ''}`;

            // 获取第一个字段作为示例（用于判断类型等）
            const firstField = configSelectedFields[0];
            const firstIdx = data.fields.indexOf(firstField);
            const isNum = data.rows.length > 0 && typeof data.rows[0]?.[firstIdx] === 'number';
            // 检查所有选中字段是否都是数值
            const allNum = configSelectedFields.every(f => {
                const idx = data.fields.indexOf(f);
                return data.rows.length > 0 && typeof data.rows[0]?.[idx] === 'number';
            });

            let html = `
                <div class="op-group">
                    <label><i class="fas fa-tag"></i> 批量设置别名</label>
                    <input type="text" id="opAliasBatch" placeholder="输入统一别名" oninput="batchUpdateAlias(this.value)" />
                </div>
            `;

            if (allNum) {
                html += `
                    <div class="op-group">
                        <label><i class="fas fa-calculator"></i> 批量聚合</label>
                        <div class="op-row">
                            ${['none','sum','avg','count','min','max'].map(a => `
                                <button class="op-btn ${getBatchAgg() === a ? 'active' : ''}" onclick="batchUpdateAgg('${a}')">${a}</button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            html += `
                <div class="op-group">
                    <label><i class="fas fa-sort"></i> 批量排序</label>
                    <div class="op-row">
                        ${['none','asc','desc'].map(s => `
                            <button class="op-btn ${getBatchSort() === s ? 'active' : ''}" onclick="batchUpdateSort('${s}')">${s}</button>
                        `).join('')}
                    </div>
                </div>
                <div class="op-group">
                    <label><i class="fas fa-filter"></i> 批量过滤条件 (应用到所有选中字段)</label>
                    <input type="text" id="opFilterBatch" placeholder="例如: > 1000" oninput="batchUpdateFilter(this.value)" />
                </div>
                <hr class="op-divider" />
                <div class="op-group">
                    <label><i class="fas fa-eye"></i> 批量可见性</label>
                    <div class="op-row">
                        <button class="op-btn ${getBatchHidden() === false ? 'active' : ''}" onclick="batchUpdateHidden(false)">显示</button>
                        <button class="op-btn ${getBatchHidden() === true ? 'active' : ''}" onclick="batchUpdateHidden(true)">隐藏</button>
                    </div>
                </div>
                <hr class="op-divider" />
                <div style="font-size:11px;color:#4a5a78;padding:4px 0;">
                    <i class="fas fa-info-circle"></i> 共选中 ${configSelectedFields.length} 个字段
                </div>
            `;

            container.innerHTML = html;

            // 填充当前批量值
            const aliasInput = document.getElementById('opAliasBatch');
            if (aliasInput) {
                // 如果所有字段别名相同则显示，否则留空
                const aliases = configSelectedFields.map(f => configFieldOps[f]?.alias || f);
                if (aliases.every(a => a === aliases[0])) {
                    aliasInput.value = aliases[0];
                } else {
                    aliasInput.value = '';
                }
            }

            const filterInput = document.getElementById('opFilterBatch');
            if (filterInput) {
                const filters = configSelectedFields.map(f => configFieldOps[f]?.filter || '');
                if (filters.every(f => f === filters[0])) {
                    filterInput.value = filters[0];
                } else {
                    filterInput.value = '';
                }
            }
        }

        // ---- 批量操作辅助函数 ----
        function getBatchAgg() {
            const aggs = configSelectedFields.map(f => configFieldOps[f]?.agg || 'none');
            if (aggs.every(a => a === aggs[0])) return aggs[0];
            return null;
        }

        function getBatchSort() {
            const sorts = configSelectedFields.map(f => configFieldOps[f]?.sort || 'none');
            if (sorts.every(s => s === sorts[0])) return sorts[0];
            return null;
        }

        function getBatchHidden() {
            const hiddens = configSelectedFields.map(f => configFieldOps[f]?.hidden || false);
            if (hiddens.every(h => h === hiddens[0])) return hiddens[0];
            return null;
        }

        function batchUpdateAlias(value) {
            configSelectedFields.forEach(f => {
                if (!configFieldOps[f]) configFieldOps[f] = { agg: 'none', sort: 'none', filter: '', hidden: false,
                    alias: f };
                configFieldOps[f].alias = value || f;
            });
            renderConfigFieldList();
            renderConfigPreview();
        }

        function batchUpdateAgg(value) {
            configSelectedFields.forEach(f => {
                if (!configFieldOps[f]) configFieldOps[f] = { agg: 'none', sort: 'none', filter: '', hidden: false,
                    alias: f };
                configFieldOps[f].agg = value;
            });
            renderConfigOpPanel();
            renderConfigPreview();
        }

        function batchUpdateSort(value) {
            configSelectedFields.forEach(f => {
                if (!configFieldOps[f]) configFieldOps[f] = { agg: 'none', sort: 'none', filter: '', hidden: false,
                    alias: f };
                configFieldOps[f].sort = value;
            });
            renderConfigOpPanel();
            renderConfigPreview();
        }

        function batchUpdateFilter(value) {
            configSelectedFields.forEach(f => {
                if (!configFieldOps[f]) configFieldOps[f] = { agg: 'none', sort: 'none', filter: '', hidden: false,
                    alias: f };
                configFieldOps[f].filter = value;
            });
            renderConfigPreview();
        }

        function batchUpdateHidden(value) {
            configSelectedFields.forEach(f => {
                if (!configFieldOps[f]) configFieldOps[f] = { agg: 'none', sort: 'none', filter: '', hidden: false,
                    alias: f };
                configFieldOps[f].hidden = value;
            });
            renderConfigFieldList();
            renderConfigOpPanel();
            renderConfigPreview();
        }

        // ---- 预览 ----
        function renderConfigPreview() {
            const container = document.getElementById('configPreview');
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);

            // 收集可见字段（所有未隐藏的字段）
            const visibleFields = data.fields.filter(f => {
                const ops = configFieldOps[f];
                return ops && !ops.hidden;
            });

            if (visibleFields.length === 0) {
                container.innerHTML = `
                    <div class="preview-empty">
                        <i class="fas fa-eye-slash"></i>
                        所有字段已隐藏，请显示至少一个字段
                    </div>
                `;
                document.getElementById('previewInfo').textContent = '无可见字段';
                return;
            }

            // 应用过滤、排序、聚合
            let previewRows = data.rows.map(r => [...r]);
            const fields = data.fields;

            // 过滤
            visibleFields.forEach(f => {
                const ops = configFieldOps[f];
                if (ops && ops.filter) {
                    const idx = fields.indexOf(f);
                    const filterStr = ops.filter.trim();
                    const match = filterStr.match(/^(>=|<=|>|<|=)\s*(.+)/);
                    if (match && idx >= 0) {
                        const [, operator, operand] = match;
                        const isNum = !isNaN(parseFloat(operand));
                        const numVal = isNum ? parseFloat(operand) : operand.replace(/["']/g, '');
                        previewRows = previewRows.filter(row => {
                            const cell = row[idx];
                            if (isNum) {
                                const numCell = parseFloat(cell);
                                if (isNaN(numCell)) return false;
                                switch (operator) {
                                    case '>': return numCell > numVal;
                                    case '<': return numCell < numVal;
                                    case '>=': return numCell >= numVal;
                                    case '<=': return numCell <= numVal;
                                    case '=': return numCell === numVal;
                                    default: return true;
                                }
                            } else {
                                const strCell = String(cell);
                                const strVal = String(numVal);
                                if (operator === '=') return strCell === strVal;
                                return true;
                            }
                        });
                    }
                }
            });

            // 排序 (按第一个有排序的字段)
            let sortField = null;
            let sortDir = 'none';
            visibleFields.forEach(f => {
                const ops = configFieldOps[f];
                if (ops && ops.sort && ops.sort !== 'none') {
                    if (!sortField || ops.sort === 'asc') {
                        sortField = f;
                        sortDir = ops.sort;
                    }
                }
            });
            if (sortField && sortDir !== 'none') {
                const idx = fields.indexOf(sortField);
                const dir = sortDir === 'asc' ? 1 : -1;
                previewRows.sort((a, b) => {
                    const va = a[idx],
                        vb = b[idx];
                    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
                    return String(va).localeCompare(String(vb)) * dir;
                });
            }

            // 聚合处理 (取所有数值字段的聚合)
            let aggFields = visibleFields.filter(f => {
                const ops = configFieldOps[f];
                const isNum = data.rows.length > 0 && typeof data.rows[0]?.[fields.indexOf(f)] === 'number';
                return ops && ops.agg && ops.agg !== 'none' && isNum;
            });

            let displayData = previewRows;
            let displayFields = visibleFields.map(f => {
                const ops = configFieldOps[f];
                return ops && ops.alias ? ops.alias : f;
            });

            if (aggFields.length > 0 && previewRows.length > 0) {
                const groupFields = visibleFields.filter(f => {
                    const ops = configFieldOps[f];
                    const isNum = data.rows.length > 0 && typeof data.rows[0]?.[fields.indexOf(f)] === 'number';
                    return !(ops && ops.agg && ops.agg !== 'none' && isNum);
                });

                if (groupFields.length > 0) {
                    const groups = {};
                    previewRows.forEach(row => {
                        const key = groupFields.map(f => row[fields.indexOf(f)]).join('|');
                        if (!groups[key]) {
                            groups[key] = { count: 0, rows: [] };
                        }
                        groups[key].count++;
                        groups[key].rows.push(row);
                    });

                    const aggResults = [];
                    Object.values(groups).forEach(g => {
                        const aggRow = [];
                        visibleFields.forEach(f => {
                            const idx = fields.indexOf(f);
                            const ops = configFieldOps[f];
                            const isNum = data.rows.length > 0 && typeof data.rows[0]?.[idx] === 'number';
                            if (isNum && ops && ops.agg && ops.agg !== 'none') {
                                const vals = g.rows.map(r => parseFloat(r[idx])).filter(v => !isNaN(v));
                                let result = 0;
                                switch (ops.agg) {
                                    case 'sum':
                                        result = vals.reduce((a, b) => a + b, 0);
                                        break;
                                    case 'avg':
                                        result = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
                                        break;
                                    case 'count':
                                        result = vals.length;
                                        break;
                                    case 'min':
                                        result = Math.min(...vals);
                                        break;
                                    case 'max':
                                        result = Math.max(...vals);
                                        break;
                                    default:
                                        result = vals[0] || 0;
                                }
                                aggRow.push(Math.round(result * 100) / 100);
                            } else {
                                aggRow.push(g.rows[0][idx]);
                            }
                        });
                        aggResults.push(aggRow);
                    });
                    displayData = aggResults;
                } else {
                    // 只有聚合字段，全局聚合
                    const aggRow = [];
                    visibleFields.forEach(f => {
                        const idx = fields.indexOf(f);
                        const ops = configFieldOps[f];
                        const isNum = data.rows.length > 0 && typeof data.rows[0]?.[idx] === 'number';
                        if (isNum && ops && ops.agg && ops.agg !== 'none') {
                            const vals = previewRows.map(r => parseFloat(r[idx])).filter(v => !isNaN(v));
                            let result = 0;
                            switch (ops.agg) {
                                case 'sum':
                                    result = vals.reduce((a, b) => a + b, 0);
                                    break;
                                case 'avg':
                                    result = vals.reduce((a, b) => a + b, 0) / (vals.length || 1);
                                    break;
                                case 'count':
                                    result = vals.length;
                                    break;
                                case 'min':
                                    result = Math.min(...vals);
                                    break;
                                case 'max':
                                    result = Math.max(...vals);
                                    break;
                                default:
                                    result = vals[0] || 0;
                            }
                            aggRow.push(Math.round(result * 100) / 100);
                        } else {
                            aggRow.push(previewRows[0]?.[idx] || '');
                        }
                    });
                    displayData = [aggRow];
                }
            }

            // 渲染预览
            container.innerHTML = '';
            const widget = widgets.find(w => w.id === configTargetId);
            const chartType = widget ? widget.type : 'bar';

            if (visibleFields.length === 0 || displayData.length === 0) {
                container.innerHTML = `<div class="preview-empty"><i class="fas fa-database"></i>无数据</div>`;
                document.getElementById('previewInfo').textContent = '无数据';
                return;
            }

            document.getElementById('previewInfo').textContent =
                `${displayData.length} 行 · ${visibleFields.length} 字段`;

            if (chartType === 'kpi') {
                const grid = document.createElement('div');
                grid.className = 'kpi-grid-preview';
                const sampleRow = displayData[0] || [];
                visibleFields.forEach((f, i) => {
                    const val = sampleRow[i] !== undefined ? sampleRow[i] : '—';
                    const div = document.createElement('div');
                    div.className = 'kpi';
                    div.style.borderLeftColor = '#3b82f6';
                    div.innerHTML = `
                        <div class="value">${typeof val === 'number' ? val.toLocaleString() : val}</div>
                        <div class="label">${displayFields[i] || f}</div>
                    `;
                    grid.appendChild(div);
                });
                container.appendChild(grid);
            } else if (chartType === 'table') {
                const table = document.createElement('table');
                table.className = 'table-view';
                const thead = document.createElement('thead');
                const trHead = document.createElement('tr');
                visibleFields.forEach((f, i) => {
                    const th = document.createElement('th');
                    th.textContent = displayFields[i] || f;
                    trHead.appendChild(th);
                });
                thead.appendChild(trHead);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');
                const displayRows = displayData.slice(0, 10);
                displayRows.forEach(row => {
                    const tr = document.createElement('tr');
                    visibleFields.forEach((f, i) => {
                        const td = document.createElement('td');
                        const val = row[i] !== undefined ? row[i] : '—';
                        td.textContent = typeof val === 'number' ? val.toLocaleString() : val;
                        tr.appendChild(td);
                    });
                    tbody.appendChild(tr);
                });
                table.appendChild(tbody);
                container.appendChild(table);
                if (displayData.length > 10) {
                    const note = document.createElement('div');
                    note.style.cssText = 'font-size:9px;color:#4a5a78;text-align:right;margin-top:4px;';
                    note.textContent = `显示前10条，共${displayData.length}条`;
                    container.appendChild(note);
                }
            } else {
                // 图表 (bar/line/pie)
                let dimIdx = -1,
                    measIdx = -1;
                visibleFields.forEach((f, i) => {
                    const idx = fields.indexOf(f);
                    const isNum = data.rows.length > 0 && typeof data.rows[0]?.[idx] === 'number';
                    if (!isNum && dimIdx === -1) dimIdx = i;
                    if (isNum && measIdx === -1) measIdx = i;
                });
                if (dimIdx === -1) dimIdx = 0;
                if (measIdx === -1) measIdx = Math.min(1, visibleFields.length - 1);

                const groups = {};
                displayData.forEach(row => {
                    const key = String(row[dimIdx] !== undefined ? row[dimIdx] : 'Unknown');
                    const val = parseFloat(row[measIdx]) || 0;
                    groups[key] = (groups[key] || 0) + val;
                });
                const entries = Object.entries(groups).slice(0, 10);
                const maxVal = Math.max(...entries.map(e => e[1]), 1);

                const chartContainer = document.createElement('div');
                chartContainer.className = 'chart-container';
                chartContainer.style.minHeight = '140px';

                if (chartType === 'pie') {
                    const total = entries.reduce((s, e) => s + e[1], 0);
                    const colors = ['#3b82f6', '#8b5cf6', '#f59e0b', '#22c55e', '#ef4444', '#ec4899', '#14b8a6', '#f97316'];
                    entries.forEach(([label, value], idx) => {
                        const pct = total ? ((value / total) * 100).toFixed(0) : 0;
                        const div = document.createElement('div');
                        div.style.cssText =
                            `flex:${Math.max(pct, 1)};height:100%;background:${colors[idx % colors.length]};border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:white;text-shadow:0 1px 4px rgba(0,0,0,0.5);padding:4px;min-width:30px;`;
                        div.innerHTML =
                            `<span>${pct}%</span><span style="font-size:8px;opacity:0.7;">${label}</span>`;
                        chartContainer.appendChild(div);
                    });
                } else {
                    entries.forEach(([label, value]) => {
                        const bar = document.createElement('div');
                        bar.className = 'bar';
                        const h = Math.max((value / maxVal) * 80, 6);
                        bar.style.height = h + '%';
                        bar.style.background = `linear-gradient(to top, #3b82f6, #8b5cf6)`;
                        bar.innerHTML = `
                            <span>${typeof value === 'number' ? value.toFixed(0) : value}</span>
                            <span class="bar-label">${label}</span>
                        `;
                        if (chartType === 'line') {
                            bar.style.borderRadius = '50% 50% 0 0';
                            bar.style.width = '14px';
                            bar.style.margin = '0 auto';
                        }
                        chartContainer.appendChild(bar);
                    });
                }
                container.appendChild(chartContainer);
                const legend = document.createElement('div');
                legend.style.cssText =
                    'font-size:9px;color:#6a7b98;text-align:center;margin-top:4px;flex-shrink:0;';
                legend.textContent =
                `📊 ${displayFields[dimIdx] || visibleFields[dimIdx]} → ${displayFields[measIdx] || visibleFields[measIdx]}`;
                container.appendChild(legend);
            }
        }

        function updateConfigFieldCount() {
            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);
            document.getElementById('configFieldCount').textContent = `${data.fields.length} 个字段`;
        }

        // ================================================================
        //  17. 应用配置
        // ================================================================
        function applyConfig() {
            if (configTargetId === null) return;
            const w = widgets.find(w => w.id === configTargetId);
            if (!w) return;
            pushHistory();

            const ds = document.getElementById('configDataSource').value;
            const data = getTableData(ds);

            // 收集可见字段
            const visibleFields = data.fields.filter(f => {
                const ops = configFieldOps[f];
                return ops && !ops.hidden;
            });

            if (visibleFields.length === 0) {
                showToast('⚠️ 至少保留一个可见字段');
                return;
            }

            w.dataSource = ds;
            w.field = visibleFields[0] || null;
            w.config = {
                fieldOps: { ...configFieldOps },
                visibleFields: visibleFields
            };

            // 更新标题（取第一个可见字段的别名）
            const firstField = visibleFields[0];
            if (firstField) {
                const ops = configFieldOps[firstField];
                const alias = ops && ops.alias ? ops.alias : firstField;
                w.title = `${alias} 分析`;
            }

            renderAll();
            closeConfig();
            scheduleSave();
            showToast(`✅ 已应用配置到「${w.title}」`);
        }

        // ================================================================
        //  18. 初始化
        // ================================================================
        renderDataTree();

        // 优先从 localStorage 恢复上次的画布；否则加载示例布局
        const restored = loadState();
        if (!restored) {
            addWidget('kpi', { title: '总销售额', dataSource: 'orders', x: 12, y: 12, color: '#3b82f6' });
            addWidget('bar', { title: '品类销售额', dataSource: 'orders', x: 200, y: 12, color: '#8b5cf6' });
            addWidget('pie', { title: '地区分布', dataSource: 'customers', x: 450, y: 12, color: '#f59e0b' });
            addWidget('table', { title: '订单明细', dataSource: 'orders', x: 12, y: 150, color: '#22c55e' });
        } else {
            renderAll();
        }

        // 初始化产生的状态不入历史栈
        undoStack.length = 0;
        redoStack.length = 0;
        updateHistoryButtons();

        if (widgets.length > 0) selectWidget(widgets[0].id);

        console.log('✅ Well-Insight Studio 已启动');
        console.log(restored ? '💾 已从本地存储恢复画布' : '🎨 已加载示例布局');
        console.log('💡 双击组件或点击 ⚙️ 打开配置，支持多选字段批量操作');
        console.log('⌨️ Ctrl+Z 撤销 · Ctrl+Y 重做 · Delete 删除 · Esc 取消');
    </script>
</body>
