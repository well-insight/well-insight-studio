<!DOCTYPE html>
<html lang="zh">
<head>
    <title>加载KML并渲染点云</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Monospace; }
        #info { 
            position: absolute; 
            top: 10px; 
            width: 100%; 
            text-align: center; 
            color: white; 
            background-color: rgba(0, 0, 0, 0.5); 
            padding: 10px; 
            z-index: 100; 
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="info">正在加载...</div>

<script src="./libs/three.min.js"></script>
<script src="./libs/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geolib@3.3.1/es/dist/geolib.min.js"></script> <!-- 使用geolib处理地理坐标 -->

<script>
    let scene, camera, renderer, controls;

    init();
    animate();

    function init() {
        // 初始化场景、相机和渲染器...
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);

        // 添加光源...
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        scene.add(directionalLight);

        // 加载本地KML文件
        loadKML('./data.kml');
    }

    function loadKML(path) {
        const loader = new THREE.FileLoader();
        loader.load(path, function (text) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(text, "text/xml");
            const coordinatesElements = xmlDoc.getElementsByTagName("coordinates");

            let points = [];
            let colors = [];

            for (let i = 0; i < coordinatesElements.length; i++) {
                const coordsText = coordinatesElements[i].textContent.trim();
                const coords = coordsText.split(' ');

                for (let coord of coords) {
                    const [lon, lat, alt] = coord.split(',').map(Number);
                    // 假设转换函数将经纬度转换为Three.js场景中的位置
                    const pos = convertLatLngToScenePosition(lat, lon, alt);
                    points.push(pos.x, pos.y, pos.z);

                    // 设置颜色等逻辑
                    const color = new THREE.Color(Math.random(), Math.random(), Math.random());
                    colors.push(color.r, color.g, color.b);
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 0.1, vertexColors: true });
            const pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);

            document.getElementById('info').innerHTML = 'KML加载完成';
        });
    }

    function convertLatLngToScenePosition(lat, lon, alt) {
        // 这里简化了转换过程，实际情况可能需要更复杂的转换
        // 假设地球是完美的球体，这里只做一个粗略的位置映射
        const RADIUS = 6371; // 地球半径，单位：公里
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 180) * (Math.PI / 180);

        return new THREE.Vector3(
            RADIUS * Math.sin(phi) * Math.cos(theta),
            RADIUS * Math.sin(phi) * Math.sin(theta),
            RADIUS * Math.cos(phi)
        ).multiplyScalar(alt / RADIUS);
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
