<!doctype html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1,maximum-scale=1,user-scalable=0"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=yes"
      media="(min-width: 769px)"
    />
    <link rel="icon" href="./logo.svg" />
    <title>WellCube</title>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <!-- 加载动画容器 -->
    <div id="app-loading">
      <div class="wave-matrix-wrapper">
        <!-- 5行5列，共25个点（完美正方形） -->
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
        <div class="matrix-dot"></div>
      </div>
    </div>

    <!-- Vue 挂载点 -->
    <div id="app"></div>

    <!-- 入口文件 -->
    <script type="module" src="/src/main.ts"></script>

    <!-- 隐藏加载动画逻辑 -->
    <script>
      window.addEventListener("load", () => {
        setTimeout(() => {
          const loadingEl = document.getElementById("app-loading");
          if (loadingEl) {
            loadingEl.classList.add("loading-hidden");
            setTimeout(() => loadingEl.remove(), 600);
          }
        }, 400);
      });
    </script>
  </body>
</html>
